name: Import EchoBridge source

on:
  push:
    paths:
      - echobridge-source.zip

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import source archive
        shell: bash
        run: |
          if [ ! -f echobridge-source.zip ]; then exit 0; fi
          unzip -o echobridge-source.zip
          rm echobridge-source.zip
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upload EchoBridge source code"
          git push
