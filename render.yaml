services:
  - type: web
    name: echobridge
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@10.15.1 && pnpm install --no-frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DASHSCOPE_API_KEY
        sync: false


